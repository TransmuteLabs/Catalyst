parent = "critique"
allowed = ["glm-5.3-flash", "grok-4.6", "glm-5.3", "gpt-5.6-sol", "deepseek-flash", "opus", "claude-opus-5[1m]", "qwen3.8-flash", "fable", "fable-5-1", "claude-fable-5-1", "claude-fable-5-1[1m]", "devin/swe-2"]

[classes.audit-form]
label = "СЕТКА: аудит claim-truth / артефакты vs заявки / ценз соответствия"
parent = "audit"
