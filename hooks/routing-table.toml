# Catalyst dispatch routing table — НОРМАТИВНЫЙ ДОМ исполняемых правил
# маршрутизации моделей (norms.yaml: routing-table-normative).
#
# Два потребителя (spec 2026-07-27-dispatch-gate):
#   - hooks/dispatch-gate.py  — PreToolUse-гейт: проверяет каждый Task/Agent-диспатч
#     и envoy/прокси-вызовы в Bash; нарушение = deny с причиной.
#   - hooks/session-start     — инжектит компактный срез этих правил в контекст
#     (рендерится из ЭТОГО файла: dispatch-gate.py --render-slice).
#
# Источник содержания: MODEL-ROUTING-PLAYBOOK.md §0-§6 (прозаическое зеркало).
# Измерения, профили моделей (§11), данные арен — остаются прозой в плейбуке,
# в таблицу не переносятся.
#
# Оверрайды — СЛОЯМИ, каждый следующий сильнее (сливаются, не заменяют файл):
#   1. эта база (поставляется с плагином)
#   2. ~/.claude/catalyst/routing-override.toml            — машина
#   3. <проект>/.claude/catalyst/routing-override.toml     — проект/каталог
# Ищется ближайший вверх от cwd. Названная запись (например [classes.1e])
# заменяет одноимённую базовую ЦЕЛИКОМ; записи, которых слой не называет,
# сохраняются — поэтому проектный конфиг может перенастроить один класс, не
# переписывая таблицу. Пустой allowed = никто не допущен.
#
# Идентификация каналов в Bash (константы контракта, зеркалятся в гейте,
# т.к. ранний выход обязан работать и при нечитаемой таблице):
#   envoy          — "envoy-companion.mjs" + подкоманда "task"
#   proxy          — "8317/v1/chat/completions"
#   proxy-critique — "proxy-critique"

schema_version = 1

# ---------------------------------------------------------------------------
# Совпадение имени модели — ТОЧНОЕ, без учёта регистра: подстрочный матч
# пропускал бы нератифицированные модели прокси (glm-5-turbo,
# kimi-k3-256k, gpt-5.5, codex-*). Списки БЕЛЫЕ: модель, не названная ни в
# одном классе, не допущена никуда.
#
# КЛАССЫ — единственный дом наборов моделей. Каждый диспатч ОБЯЗАН объявить
# свой класс маркером [dispatch-class:<id>] в промпте: диспатч, не попавший ни
# в один случай, не проверяется ничем, а это и есть та дыра, ради которой гейт
# существует. Классификация остаётся решением контроллера — обязательным стало
# её ОБЪЯВЛЕНИЕ. Эскалация после провала = объявить класс выше.
#
# Исполнительские классы (§1). Плейбучные 1d (fix-волна по своему коду) и 1f
# (смешанная волна) сюда НЕ добавлять: это правила РАСЩЕПЛЕНИЯ, а не классы —
# у обоих ветки указывают на другие классы, и расщепление обязано произойти ДО
# диспатча.
# ---------------------------------------------------------------------------

[classes.1a]
label = "механический фикс с точным направлением"
allowed = ["glm-5.3", "grok-4.6", "gpt-5.6-sol"]
reason = "§1a: grok-4.6 (минуты, ратифицирован кампанией 2026-08-13 + волна FIX-163B) или gpt-sol; glm-5.3 если волна большая и дотошность важнее скорости (замер FIX-163C 2026-08-16: 12 пунктов, 0 отклонений). kimi сюда НЕ гнать — 1-3 ч на 15-минутную работу. deepseek-v4-pro снят из исполнителей 2026-08-16 (юзер: API-цена, клетки закрыты безлимитными)"

[classes.1b]
label = "локализованный механизм по запиненному дизайну"
allowed = ["gpt-5.6-sol", "kimi-k3"]
reason = "§1b: opus/opus-1m СНЯТЫ 2026-08-12 (директива юзера «убрать в исполнителях opus, где заменим вендором»); эскалация 1b→1c только честной переклассификацией по триггерам. gpt-sol — следить за полнотой тестов; kimi-CLI при свободном окне. Кандидаты замера (glm-5.3, grok-4.6) — в машинном оверрайде"

[classes.1c]
label = "новый механизм в ПРОД-контуре / переархитектура / конкуренция-локи-durability / breaking публичных поверхностей"
allowed = ["kimi-k3", "opus", "claude-opus-5[1m]"]
reason = "§1c: kimi-CLI база (победитель C2/R2/race-2); критический компонент → арена исполнителей + синтез. СУЖЕН 2026-08-12: механизм вне прод-радиуса → 1h, тираж готового канона → 1g — до сужения оба тихо проваливались сюда"

[classes.1g]
label = "тираж по канону-образцу (паттерн уже в дереве с file:line, ноль дизайн-решений)"
allowed = ["glm-5.3", "gpt-5.6-sol", "grok-4.6"]
reason = "§1g (2026-08-12): канон стоит в дереве, работа = растиражировать с честными доками/тестами; opus в класс НЕ входит намеренно. Открытый дизайн-вопрос в брифе = класс объявлен неверно (снять вопрос адъюдикацией, потом 1g)"

[classes.1h]
label = "механизм в тест-инструментальном контуре (cfg(test)-гарды/сканеры/фикстуры/tools) — прод-радиус нулевой"
allowed = ["gpt-5.6-sol", "glm-5.3", "kimi-k3"]
reason = "§1h (2026-08-12): критерий класса — прод-радиус, не сложность; opus только эскалацией после провала (объявить 1b/1c)"

[classes.1e]
label = "большой объём по детальному брифу"
allowed = ["glm-5.3", "grok-4.6", "gpt-5.6-sol"]
reason = "§1e: glm-5.3 (безлимит, дисциплина флагов/границ; замер 1e 2026-08-15 сильный); grok — скорость; gpt-sol — точность при минимуме тестов. MiniMax-M3 удалён (вне ротации, юзер 2026-07-21, исчез из прокси 2026-08-08); deepseek-v4-pro снят из исполнителей 2026-08-16 (API-цена)"

# ---------------------------------------------------------------------------
# Неисполнительские классы: критика, аудит, диагноз, разведка, исследование,
# адъюдикация. Объявляются тем же маркером — обязательность одна для всех.
# ---------------------------------------------------------------------------

[classes.critique]
label = "критика диффа / ревью / док-критика"
allowed = ["opus", "claude-opus-5[1m]", "fable", "kimi-k3", "gpt-5.6-sol", "grok-4.6", "glm-5.3", "deepseek-v4-flash"]
reason = "ядро §4: grok-4.6 ратифицирован 2026-08-13 (0 ложных, вкл. конкурентный код) — дефолтный per-task критик; glm-5.3 — второй дефолтный голос (замер FIX-163B: 9 находок, 0 ложных, уники по границам); flash — дешёвый добор веера (6 прогонов, 0 ложных); kimi — рефутации перечнями; opus — по триггерам (критичный механизм, регрессия → BASE-vs-HEAD). Дифф исполнителя критикует ДРУГАЯ модель. Состав под конкретный дифф выбирает контроллер"

[classes.audit]
label = "fresh-eyes re-audit финального состояния"
allowed = ["opus", "claude-opus-5[1m]", "fable", "gpt-5.6-sol", "grok-4.6", "glm-5.3", "deepseek-v4-flash"]
reason = "§7: пары без пересечения профилей; grok-4.6 — в СОСТАВЕ ПАРЫ grok+(fable|opus), не единственным (арены E/F); flash — измеренный аудитор (арена F 3/3 + арена посадки 150/210: единственная механизменная находка); glm-5.3 — сильный замер 2026-08-15, пара flash+glm закрывает не-Anthropic аудит; deepseek-v4-pro снят 2026-08-16 (двойной провал оси квантора)"

[classes.analysis]
label = "диагноз / root-cause / расследование"
allowed = ["opus", "claude-opus-5[1m]", "fable", "kimi-k3", "grok-4.6", "gpt-5.6-sol", "deepseek-v4-flash"]
reason = "§2: дефолт класса — веер grok+flash (арена E: оба 8/8, 0 ложных; flash 14,5 мин — лучшая цена/качество, kimi — лучшая систематизация, но дорог временем); opus/fable — по триггерам (конкуренция/локи/durability, зависания, расхождение веера, высокая цена ошибки)"

[classes.scout]
label = "разведка фактов по кодовой базе (найди/перечисли/измерь/процитируй)"
allowed = ["grok-4.6", "glm-5.3", "gpt-5.6-sol", "gpt-5.6-luna", "opus", "claude-opus-5[1m]", "deepseek-v4-pro"]
reason = "§3: deepseek-v4-pro — сильнейшая измеренная роль (PA8/PA57: полные переписи, ось исчерпываемости пройдена, 12 мин) — ЕДИНСТВЕННЫЙ исполнительско-разведочный дом pro (API-цена, юзер 2026-08-16); grok — эталон переписей; luna — сверки полноты/чужой код (отрицания проверять деревом); glm-5.3 — механизм-поиск; gpt-sol — чужой код точно; flash из scout снят 2026-08-14 (лоб-в-лоб PA8 проиграл pro). kimi НЕ гнать"

[classes.research]
label = "внешнее исследование (web, доки, чужие репозитории)"
allowed = ["opus", "claude-opus-5[1m]", "fable", "deepseek-v4-pro"]
reason = "§9: grounding-гейт (источники + уверенность + контраргументы); deepseek-v4-pro измерен и принят 2026-08-16 (cancellation-semantics по первоисходникам SDK, file:line+confidence, честные inferred). Кандидаты замера (glm-5.3, grok-4.6, flash) — в машинном оверрайде"

[classes.adjudication]
label = "адъюдикация / архитектура / спеки / финальный вердикт"
allowed = []
reason = "§6 — только главный луп, не делегируется никакой модели"

# ---------------------------------------------------------------------------
# РОЛИ — не второй набор моделей, а привязка ИМЕНИ агента к его классу.
# Списков allowed здесь нет намеренно: два набора моделей разошлись бы
# (norms.yaml, дефект-класс «дублированная норма»). Роль ловит расхождение:
# если имя агента говорит «критик», а объявлен исполнительский класс — отказ.
# ---------------------------------------------------------------------------

[roles.critic]
match = ["critic", "reviewer", "judge"]
class = "critique"

[roles.auditor]
match = ["auditor"]
class = "audit"

[roles.analysis]
match = ["debug", "sleuth", "analyst", "analyzer", "profiler", "root-cause"]
class = "analysis"

[roles.scout]
match = ["scout", "explore", "recon"]
class = "scout"

[roles.researcher]
match = ["researcher", "oracle"]
class = "research"

[roles.adjudicator]
match = ["adjudicat"]
class = "adjudication"

# ---------------------------------------------------------------------------
# ПРИНЯТЫЕ EFFORT ПО МОДЕЛЯМ (леджер эффективности; нарушать нельзя).
# Один набор на все каналы, где модель+effort извлекаемы: Agent-канал
# (frontmatter `effort:` определения агента), прокси-POST, proxy-critique.
# К envoy-CLI НЕ применяется (у CLI свои потолки: grok-CLI ≤ high).
# ---------------------------------------------------------------------------

[pins]
"glm-5.3" = ["max"]                        # ТОЛЬКО max (директива юзера 2026-08-14)
"kimi-k3" = ["high"]                       # max даёт ложные находки (§0)
"grok-4.6" = ["max"]                       # прокси/Agent-путь; CLI-потолок high — это envoy
"gpt-5.6-sol" = ["high", "xhigh"]          # леджер
"gpt-5.6-luna" = ["max"]                   # леджер (замер 2026-08-09)
"deepseek-v4-flash" = ["high", "xhigh"]    # леджер (арены E/F)
"deepseek-v4-pro" = ["high", "xhigh", "max"]  # scout high достаточно; research max

# ---------------------------------------------------------------------------
# Agent/Task-канал: у прокси-моделей effort ОБЯЗАТЕЛЕН (юзер 2026-07-27).
# Носитель — frontmatter-поле `effort:` определения агента (харнес шлёт
# output_config.effort; замер 2026-07-27: z.ai чтит, glm low→max ~50× thinking).
# Anthropic-модели (fable/opus) — effort нативный, не требуется.
# codex/kimi/grok-ИСПОЛНИТЕЛИ остаются на своих CLI (envoy) — родной харнес
# работает лучше; Agent-канал с effort — для glm/kimi-k3 и арен.
# ---------------------------------------------------------------------------

[channels.agent]
effort_required_for = ["glm-5.3", "grok-4.6", "kimi-k3", "gpt-5.6-sol", "gpt-5.6-luna", "deepseek-v4-flash", "deepseek-v4-pro"]

# ---------------------------------------------------------------------------
# Bash-каналы: требования к effort (§0). Тихий дефолт вендора — дефект
# (прецедент: ретракт ранга R3 2026-07-20 по effort-конфаунду).
# ---------------------------------------------------------------------------

[channels.envoy.vendors.codex]
effort_required = true

[channels.envoy.vendors.grok]
effort_required = true

[channels.envoy.vendors.kimi]
effort_required = false   # kimi не принимает --effort; companion падает fast при попытке

# Прокси-POST (127.0.0.1:8317) — канал критики: reasoning_effort обязан быть
# ВИДЕН в команде (inline-тело или обёртка proxy-critique). Допустимые
# значения — общий [pins].

[channels.proxy]
effort_required = true

# ---------------------------------------------------------------------------
# ПРЯМОЙ ЗАПУСК ВЕНДОРСКОГО CLI (мимо envoy-companion). Те же модели и тот же
# леджер — значит те же правила: иначе вся таблица в одном `codex exec` от
# того, чтобы стать рекомендательной. Ловится ИСПОЛНЯЕМАЯ позиция команды
# (первое слово сегмента, после VAR=val и env), поэтому `grep codex notes.md`
# каналом не считается.
#
# bin — имена бинарей, под которыми вендор запускается (basename, без учёта
# регистра). model_required — запуск без --model отклоняется: дефолтная модель
# CLI не является решением маршрутизации.
# ---------------------------------------------------------------------------

[channels.cli.vendors.codex]
bin = ["codex"]
effort_required = true
model_required = true

[channels.cli.vendors.grok]
bin = ["grok"]
effort_required = true
model_required = true

[channels.cli.vendors.kimi]
bin = ["kimi"]
effort_required = false   # kimi не принимает --effort; companion падает fast при попытке
model_required = true

[channels.cli.vendors.glm]
bin = ["glm"]
effort_required = true
model_required = true

# ---------------------------------------------------------------------------
# Обязательность объявления класса.
# ---------------------------------------------------------------------------

# mode = "deny" (штатно) — нарушение ОТКЛОНЯЕТ вызов. Правила про модели —
#   обязывающие: обязывающим правило делает именно отказ. Необязательным
#   является только наблюдение про флот ([stats]) — оно напоминает и никогда
#   не блокирует, потому что задачи действительно одного класса бывают.
# mode = "warn" — нарушение не блокирует, гейт напоминает, а PostToolUse-хук
#   доносит напоминание в контекст модели. Режим существует, но НЕ штатный:
#   в нём оркестратор, который забыл классифицировать, просто поедет дальше.
# Нечитаемая таблица блокирует в любом режиме: это не выбор маршрутизации, а
# невозможность что-либо проверить.

[dispatch]
mode = "deny"
class_marker_required = true   # диспатч без [dispatch-class:<id>] = нарушение

# ---------------------------------------------------------------------------
# ЭКСПЕРИМЕНТАЛЬНЫЙ ДОПУСК — для моделей, которые ещё не измерены (новый релиз,
# проверка канала). Ослабляет, КАКАЯ модель ведёт случай; НЕ ослабляет, можно ли
# случай делегировать вообще (пустой allowed = никто, это остаётся в силе), и не
# снимает ни явную модель, ни явный effort, ни обязательный маркер класса.
#
# Один параметр. Дом — эта секция здесь или в машинно-локальном оверрайде
# ~/.claude/catalyst/routing-override.toml. Пока он включён, гейт говорит об
# этом на каждом диспатче и в срезе SessionStart — чтобы режим проверки не стал
# молчаливым рабочим дефолтом. База держит его ВЫКЛЮЧЕННЫМ.
# ---------------------------------------------------------------------------

[experiment]
allow_all_models = false

# ---------------------------------------------------------------------------
# СТАТИСТИКА ФЛОТА (hooks/dispatch-stats.py, PostToolUse). Гейт судит только
# диспатч перед собой и не видит, что последние восемь ушли на одну модель —
# а это и есть полевой отказ: назвать модель дёшево, а вспомнить о
# классификации нужно самому. Монокультура невидима по одному диспатчу и
# очевидна в агрегате.
#
# Пороги здесь, а не в коде, чтобы правило можно было перенастроить и накрыть
# мутант-тестом наравне с остальной маршрутизацией. Напоминание —
# наблюдение, а не отказ: диспатч уже исполнен.
#
# Два независимых сигнала, потому что у каждого своя слепая зона.
# ДОМИНИРОВАНИЕ ловит, когда одна модель забрала окно. ОХВАТ ловит то, чего
# доминирование не видит в принципе: ровную ротацию между двумя-тремя
# моделями — доля ни одной не переваливает порог, а остальной флот при этом
# не запускается ни разу.
#
# window                сколько последних диспатчей рассматривать
# min_dispatches        молчать, пока данных мало
# monoculture_share     доля одной модели (или класса) в окне, с которой
#                       начинается напоминание
# min_distinct_models   ожидаемое число РАЗНЫХ моделей в окне (не больше, чем
#                       таблица вообще предлагает)
# min_distinct_classes  то же для классов
# recent_minutes        ОКНО ВЕРДИКТА в минутах. Сессия может идти неделю, и
#                       суждение по ней целиком позволяло бы модели,
#                       запущенной пять дней назад, считаться «флот в работе»,
#                       пока сегодня идёт монокультура. Накопительный вид
#                       остаётся в --report как контекст, но не как триггер.
# remind_every          не чаще одного напоминания на N диспатчей
# remind_cooldown_minutes  и не чаще одного раза в N минут. Два независимых
#                       тормоза, срабатывать должны оба: счётчик гасит повтор
#                       внутри плотной пачки, часы — надоедание в медленной
#                       сессии, растянутой на часы. Напоминание, приходящее
#                       слишком часто, перестают читать, и тогда оно не
#                       защищает ничего.
# ---------------------------------------------------------------------------

[stats]
enabled = true
window = 8
min_dispatches = 6
monoculture_share = 0.75
min_distinct_models = 3
min_distinct_classes = 3
recent_minutes = 30
remind_every = 8
remind_cooldown_minutes = 30

# Период, когда всё осознанно идёт на одну модель с приоритетом, — это решение,
# а не забывчивость. Названная здесь модель снимает наблюдение про флот
# (напоминания гейта о правилах продолжают работать). Задавать удобно в
# проектном или машинном оверрайде на время такого периода.
deliberate_model = ""

# Один и тот же экземпляр модели под разными id. Схлопывается ТОЛЬКО для счёта:
# иначе чередование opus и claude-opus-5[1m] читается как разнообразие флота,
# которого нет. Гейт продолжает сверять id точно — алиас там впустил бы
# неизмеренного однофамильца.

[stats.aliases]
"claude-opus-5[1m]" = "opus"

# ---------------------------------------------------------------------------
# ЛИМИТЫ ПУЛА (potionbard) — финальная проверка: у диспатча, чья эффективная
# модель (или вендор канала) входит в пул codex/grok/kimi, гейт спрашивает
# живой usage у демона potionbard. used_percent >= deny_at -> отказ,
# >= warn_at -> предупреждение. Пул ограничен codex/grok/kimi по слову юзера
# 2026-08-19, остальное игнорируется намеренно.
#
# Проверка fail-open НАМЕРЕННО (противоположно контракту таблицы): мёртвый
# демон не должен замораживать диспатчи флота; fail-closed остаётся у
# собственного контракта таблицы. env POTIONBAR_SOCKET сильнее socket.
#
# [limits.models] — ЛЕВЫЙ ПРЕФИКС id эффективной модели (не подстрока);
# при нескольких совпадениях побеждает САМЫЙ ДЛИННЫЙ префикс, поэтому
# оверрайд может уточнить отдельную модель поверх "gpt-". Префикс-матч
# допустим здесь потому, что лукап лимитов ничего НЕ ДОПУСКАЕТ: admission
# выше по порядку отказов уже отработал точным матчем [classes.*], и правило
# «matched EXACTLY» этой секцией не ослабляется. Модель, не matчившая ни
# один префикс, не проверяется вовсе.
#
# Значения — СПИСКИ провайдеров potionbard (модель может числиться в
# нескольких пулах: слово юзера 2026-08-19): binding модели = min по её
# списку; DENY только когда ВСЕ пула ответили и исчерпаны; неответивший
# пул deny блокирует (fail-open поэлементно) и называется в warn-тексте.
# Внутри аккаунта окна конъюнктивны (max), аккаунты — альтернативы (min).
# [limits.vendors] — каналы, где назван только вендор (envoy task без
# --model, прямой CLI без --model не проходит выше — там model_required).
# ---------------------------------------------------------------------------

[limits]
enabled = true
socket = "~/.config/potionbar/potionbard.sock"  # env POTIONBAR_SOCKET сильнее
timeout_ms = 4000
warn_at = 80.0   # binding used_percent >= warn_at -> предупреждение
deny_at = 99.5   # binding used_percent >= deny_at -> отказ

[limits.models]
"gpt-" = ["codex"]
"grok-" = ["xaicli"]
"kimi-" = ["kimicode"]

[limits.vendors]
codex = ["codex"]
grok = ["xaicli"]
kimi = ["kimicode"]
