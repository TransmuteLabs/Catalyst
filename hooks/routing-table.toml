# Catalyst dispatch routing table — НОРМАТИВНЫЙ ДОМ исполняемых правил
# маршрутизации моделей (norms.yaml: routing-table-normative).
#
# Два потребителя (spec 2026-07-27-dispatch-gate):
#   - hooks/dispatch-gate.py  — PreToolUse-гейт: проверяет каждый Task/Agent-диспатч
#     и envoy/прокси-вызовы в Bash; нарушение = deny с причиной.
#   - hooks/session-start     — инжектит компактный срез этих правил в контекст
#     (рендерится из ЭТОГО файла: dispatch-gate.py --render-slice).
#
# Источник содержания: MODEL-ROUTING-PLAYBOOK.md §0-§6 (прозаическое зеркало).
# Измерения, профили моделей (§11), данные арен — остаются прозой в плейбуке,
# в таблицу не переносятся.
#
# Оверрайды — СЛОЯМИ, каждый следующий сильнее (сливаются, не заменяют файл):
#   1. эта база (поставляется с плагином)
#   2. ~/.claude/catalyst/routing-override.toml            — машина
#   3. <проект>/.claude/catalyst/routing-override.toml     — проект/каталог
# Ищется ближайший вверх от cwd. Названная запись (например [classes.1e])
# заменяет одноимённую базовую ЦЕЛИКОМ; записи, которых слой не называет,
# сохраняются — поэтому проектный конфиг может перенастроить один класс, не
# переписывая таблицу. Пустой allowed = никто не допущен.
#
# Идентификация каналов в Bash (константы контракта, зеркалятся в гейте,
# т.к. ранний выход обязан работать и при нечитаемой таблице):
#   envoy          — "envoy-companion.mjs" + подкоманда "task"
#   proxy          — "8317/v1/chat/completions"
#   proxy-critique — "proxy-critique"

schema_version = 1

# [selection].instruction — нормативный текст ВЫБОРА РАБОТНИКОВ для
# SessionStart-среза (dispatch-gate.py --render-slice): назначение делает
# контроллер; это не допуск, не автовыбор и не deny-предикат — гейт
# по-прежнему проверяет только membership, порядок allowed модель не выбирает.
# Слои объединяют ключи [selection]. Явно заданный instruction заменяет
# унаследованное значение целиком; отсутствующий ключ, в том числе пустая
# [selection], сохраняет наследование. Пустая строка instruction скрывает
# пункт среза, но не меняет допуск.
[selection]
instruction = """GLM (glm-5.3) имеет приоритет как безлимитная модель: в каждой точке, где он допущен, доступен и отвечает требованиям задачи и приёмки, его выбирают первым. Остальные подходящие модели из допустимого пула используют для независимого второго голоса либо при занятом или недоступном окне GLM; фиксированной обязательной пары нет. Это дополнение к сетке, а не изменение допусков, ратификаций, профилей, effort-пинов, ширины и правил независимой приёмки. Требование другой модели для критики диффа исполнителя сохраняется. Безлимитность glm-5.3-flash не утверждается. Порядок allowed не выбирает модель. Правило относится к назначению работников, а не к моделям самих судей и idle-watch. Ратифицированная модель остаётся в пуле при исчерпанной квоте, занятом окне, сетевом отказе или отказе провайдера: это временная недоступность конкретного запуска. Снятие модели из конкретной клетки допускается только по сравнительному отставанию от других моделей этой клетки. В обычной работе допустимый пул означает только ратифицированный рабочий пул конкретной клетки. Полный сравнительный пул таблицы используется исключительно в периоды замеров новых моделей для сравнения способностей на конкретной клетке; участники сравнения — модели, допущенные по результатам тестов. Допуск к сравнению не означает ратификацию или включение в обычный рабочий пул. Восстановление ранее ратифицированной модели не включает режим сравнительных замеров."""

# ---------------------------------------------------------------------------
# Совпадение имени модели — ТОЧНОЕ, без учёта регистра: подстрочный матч
# пропускал бы нератифицированные модели прокси (glm-5-turbo,
# kimi-k3-256k, gpt-5.5, codex-*). Списки БЕЛЫЕ: модель, не названная ни в
# одном классе, не допущена никуда.
#
# КЛАССЫ — единственный дом наборов моделей. Каждый диспатч ОБЯЗАН объявить
# свой класс маркером [dispatch-class:<id>] в промпте: диспатч, не попавший ни
# в один случай, не проверяется ничем, а это и есть та дыра, ради которой гейт
# существует. Классификация остаётся решением контроллера — обязательным стало
# её ОБЪЯВЛЕНИЕ. Эскалация после провала = объявить класс выше.
#
# Исполнительские классы (§1). Плейбучные 1d (fix-волна по своему коду) и 1f
# (смешанная волна) сюда НЕ добавлять: это правила РАСЩЕПЛЕНИЯ, а не классы —
# у обоих ветки указывают на другие классы, и расщепление обязано произойти ДО
# диспатча.
#
# `parent = "<класс>"` у записи класса: точка сетки, которую роли (`[roles.*]`)
# и квота (`[quota]`) читают КАК родительский класс — иначе агент с ролью
# отказывает по несовпадению класса, а квота точку не видит.
# ---------------------------------------------------------------------------

[classes.1a]
label = "механический фикс с точным направлением"
allowed = ["glm-5.3-flash", "glm-5.3", "grok-4.6", "qwen3.8-flash"]
reason = "§1a: grok-4.6 (минуты, ратифицирован кампанией 2026-08-13 + волна FIX-163B) или gpt-sol; glm-5.3 — безлимитный первый выбор по [selection].instruction (замер FIX-163C 2026-08-16: 12 пунктов, 0 отклонений; прежнее условие «только если волна большая» — исторический состав, новые назначения по [selection].instruction). kimi сюда НЕ гнать — 1-3 ч на 15-минутную работу. deepseek-v4-pro снят из исполнителей 2026-08-16 (юзер: API-цена, клетки закрыты безлимитными). qwen3.8-flash — ратифицирован 2026-08-31 (исполнительские механические клетки), восстановлен в пуле 2026-09-13 по слову юзера. СЕТКА 09-07: старый id несёт ТОЛЬКО дешёвых носителей; дорогая модель требует ТОЧКИ сетки в маркере."

