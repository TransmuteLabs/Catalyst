# Catalyst dispatch routing table — НОРМАТИВНЫЙ ДОМ исполняемых правил
# маршрутизации моделей (norms.yaml: routing-table-normative).
#
# Два потребителя (spec 2026-07-27-dispatch-gate):
#   - hooks/dispatch-gate.py  — PreToolUse-гейт: проверяет каждый Task/Agent-диспатч
#     и envoy/прокси-вызовы в Bash; нарушение = deny с причиной.
#   - hooks/session-start     — инжектит компактный срез этих правил в контекст
#     (рендерится из ЭТОГО файла: dispatch-gate.py --render-slice).
#
# Источник содержания: MODEL-ROUTING-PLAYBOOK.md §0-§6 (прозаическое зеркало).
# Измерения, профили моделей (§11), данные арен — остаются прозой в плейбуке,
# в таблицу не переносятся.
#
# Оверрайд: ~/.claude/catalyst/routing-override.toml — таблица второго уровня
# (например [bans.minimax] или [roles.critic]) перекрывает одноимённую базовую
# ЦЕЛИКОМ. Пустой patterns/allowed = правило снято. Явное решение юзера
# (например допуск MiniMax) выражается записью в оверрайде, не правкой базы.
#
# Идентификация каналов в Bash (константы контракта, зеркалятся в гейте,
# т.к. ранний выход обязан работать и при нечитаемой таблице):
#   envoy          — "envoy-companion.mjs" + подкоманда "task"
#   proxy          — "8317/v1/chat/completions"
#   proxy-critique — "proxy-critique"

schema_version = 1

# ---------------------------------------------------------------------------
# Запреты моделей — действуют везде, в любой роли, по любому каналу.
# Паттерн — подстрока эффективной модели (без учёта регистра).
# ---------------------------------------------------------------------------

[bans.sonnet]
patterns = ["sonnet"]
reason = "директива юзера 2026-07-21: sonnet ни в какой роли"

[bans.haiku]
patterns = ["haiku"]
reason = "директива юзера 2026-07-21: haiku ни в какой роли"

[bans.minimax]
patterns = ["minimax"]
reason = "вне ротации (юзер 2026-07-21); допуск — только явным решением юзера записью в оверрайде"

# ---------------------------------------------------------------------------
# Роли — жёсткий минимум по subagent_type (match — подстроки, без регистра).
# allowed — паттерны эффективной модели; пустой allowed = роль не делегируется.
# ---------------------------------------------------------------------------

[roles.critic]
match = ["critic", "reviewer", "judge"]
allowed = ["opus", "fable"]
reason = "критика не ниже opus (§4-§5); вендор-критика идёт Bash-каналами (envoy/прокси), не Agent-тулом"

[roles.auditor]
match = ["auditor"]
allowed = ["opus", "fable"]
reason = "аудит не ниже opus (§7)"

[roles.adjudicator]
match = ["adjudicat"]
allowed = []
reason = "адъюдикация/архитектура/финальные вердикты — только главный луп, не делегируются (§6)"

# ---------------------------------------------------------------------------
# Классы задач исполнения (§1) — применяются ТОЛЬКО когда контроллер объявил
# класс маркером [dispatch-class:<id>] в промпте диспатча. Маркер опционален
# (D-02): классификация — решение контроллера. Эскалация после провала
# («классом вверх») — снять маркер или объявить класс выше.
# ---------------------------------------------------------------------------

[classes.1a]
label = "механический фикс с точным направлением"
allowed = ["grok", "gpt", "codex", "glm"]

[classes.1b]
label = "локализованный механизм по запиненному дизайну"
allowed = ["opus", "kimi", "gpt", "codex"]

[classes.1c]
label = "новый механизм / переархитектура / конкуренция-локи-durability"
allowed = ["kimi", "opus"]

[classes.1e]
label = "большой объём по детальному брифу"
allowed = ["glm", "gpt", "codex", "grok"]

# ---------------------------------------------------------------------------
# Bash-каналы: требования к effort (§0). Тихий дефолт вендора — дефект
# (прецедент: ретракт ранга R3 2026-07-20 по effort-конфаунду).
# ---------------------------------------------------------------------------

[channels.envoy.vendors.codex]
effort_required = true

[channels.envoy.vendors.grok]
effort_required = true

[channels.envoy.vendors.kimi]
effort_required = false   # kimi не принимает --effort; companion падает fast при попытке

# Прокси-POST (127.0.0.1:8317) — канал критики: reasoning_effort обязан быть
# ВИДЕН в команде (inline-тело или обёртка proxy-critique). Пины —
# model-паттерн → допустимые efforts на этом канале.

[channels.proxy]
effort_required = true

[channels.proxy.pins]
glm = ["xhigh"]           # критика glm ТОЛЬКО xhigh (§0)
"kimi-k3" = ["high"]      # max даёт ложные находки (§0)
grok = ["max"]            # аудит grok на прокси — max (§5); потолок CLI high — это envoy
