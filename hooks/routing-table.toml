[classes.doc-spec]
label = "СЕТКА: авторство, где текст = решение (спеки, дизайн-ноты)"
allowed = ["gpt-6-astra", "glm-5.3", "opus", "claude-opus-5[1m]", "fable", "fable-5-1", "claude-fable-5-1", "claude-fable-5-1[1m]"]

[classes.crit-form]
