allowed = ["gpt-6-astra", "gpt-5.6-sol", "grok-4.6", "glm-5.3", "opus", "claude-opus-5[1m]", "qwen3.8-flash", "fable", "fable-5-1", "claude-fable-5-1", "claude-fable-5-1[1m]", "devin/swe-2"]

[classes.crit-doc]
