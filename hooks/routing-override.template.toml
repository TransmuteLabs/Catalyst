# ШАБЛОН ФАЙЛА НАСТРОЕК МАРШРУТИЗАЦИИ. Скопировать в один из двух адресов:
#
#   ~/.claude/catalyst/routing-override.toml            — на машину
#   <проект>/.claude/catalyst/routing-override.toml     — на проект/каталог
#
# Слои применяются по возрастанию силы: база плагина < машина < проект.
# Проектный ищется ближайшим ВВЕРХ от рабочего каталога, поэтому работает и из
# подкаталога репозитория.
#
# СЛИЯНИЕ ИДЁТ ПО НАЗВАННОЙ ЗАПИСИ. `[classes.1e]` здесь заменяет одноимённую
# базовую ЦЕЛИКОМ (не по полям!), а записи, которых этот файл не называет,
# остаются базовыми. Значит: переопределяя класс, перечисляйте его allowed
# полностью — недостающие модели не «дописываются», они пропадают.
#
# Всё ниже закомментировано: файл-шаблон ничего не меняет. Раскомментируйте
# только то, что действительно переопределяете. База — hooks/routing-table.toml,
# смотрите её как справочник значений.

schema_version = 1


# ---------------------------------------------------------------------------
# РЕЖИМ ГЕЙТА
# ---------------------------------------------------------------------------
# "deny" (база) — нарушение ОТКЛОНЯЕТ вызов. Правила про модели обязывающие:
#   обязывающим правило делает именно отказ. Необязательно только наблюдение
#   про флот ([stats] ниже) — оно напоминает и никогда не блокирует.
# "warn" — нарушение не блокирует, гейт напоминает, а PostToolUse-хук доносит
#   напоминание до контекста модели. Для редкого периода, когда правила
#   осознанно приостановлены. Цена ровно та, что названа выше: оркестратор,
#   который забыл классифицировать, просто поедет дальше.
#
# Нечитаемая таблица блокирует в ЛЮБОМ режиме — это не выбор маршрутизации, а
# невозможность что-либо проверить.
#
# [dispatch]
# mode = "warn"
# class_marker_required = false


# ---------------------------------------------------------------------------
# НАБОРЫ МОДЕЛЕЙ ПО СЛУЧАЯМ
# ---------------------------------------------------------------------------
# Классы — единственный дом наборов. Списки БЕЛЫЕ, совпадение имени ТОЧНОЕ
# (без учёта регистра): неизмеренный однофамилец (gpt-5.6-luna против
# gpt-5.6-sol, kimi-k3-256k против kimi-k3) — другая модель.
#
# Исполнительские: 1a механика с точным направлением, 1b локализованный
# механизм по запиненному дизайну, 1c новый механизм/конкуренция/durability,
# 1e большой объём по детальному брифу.
# Неисполнительские: critique, audit, analysis, scout, research, adjudication.
#
# Пустой allowed = случай не делегируется никому (так задана adjudication).
#
# [classes.1e]
# label = "большой объём по детальному брифу"
# allowed = ["glm-5.2", "gpt-5.6-sol"]     # перечислять ПОЛНОСТЬЮ
# reason = "почему именно эти — сюда, чтобы отказ объяснял себя"


# ---------------------------------------------------------------------------
# ПРИВЯЗКА ИМЕНИ АГЕНТА К КЛАССУ
# ---------------------------------------------------------------------------
# Роли не хранят моделей — только класс. Если имя агента совпало с match, а
# объявлен другой класс, это нарушение: иначе критик получал бы более широкий
# исполнительский набор.
#
# [roles.critic]
# match = ["critic", "reviewer", "judge"]
# class = "critique"


# ---------------------------------------------------------------------------
# EFFORT
# ---------------------------------------------------------------------------
# pins — принятые уровни по моделям на Agent- и прокси-каналах. К вендорским
# CLI НЕ применяются: у них свои потолки (grok-CLI ≤ high).
#
# [pins]
# "glm-5.2" = ["xhigh"]
#
# Каналы: у каких моделей effort обязателен в Agent-канале, и какие вендоры
# обязаны нести явный effort в Bash.
#
# [channels.agent]
# effort_required_for = ["glm-5.2", "grok-4.5", "kimi-k3", "gpt-5.6-sol"]
#
# [channels.envoy.vendors.kimi]
# effort_required = false
#
# Прямой запуск вендорского CLI мимо envoy — тот же канал и те же правила.
# bin — имена бинарей; model_required — запуск без --model отклоняется, потому
# что дефолтная модель CLI не является решением маршрутизации.
#
# [channels.cli.vendors.codex]
# bin = ["codex"]
# effort_required = true
# model_required = true


# ---------------------------------------------------------------------------
# ЭКСПЕРИМЕНТАЛЬНЫЙ ДОПУСК — один параметр
# ---------------------------------------------------------------------------
# Прогнать модель, которой ещё нет в наборах (новый релиз, проверка канала),
# не трогая ратифицированные классы. Ослабляет только то, КАКАЯ модель ведёт
# случай: неделегируемый случай остаётся неделегируемым, а явная модель, явный
# effort и объявленный класс остаются обязательными. Пока включён, гейт
# говорит об этом на каждом диспатче и в срезе SessionStart.
#
# [experiment]
# allow_all_models = true


# ---------------------------------------------------------------------------
# СТАТИСТИКА ФЛОТА И НАПОМИНАНИЯ
# ---------------------------------------------------------------------------
# Два независимых сигнала. ДОМИНИРОВАНИЕ ловит, когда одна модель забрала окно.
# ОХВАТ ловит то, чего доминирование не видит в принципе: ровную ротацию между
# двумя-тремя моделями — доля ни одной не переваливает порог, а остальной флот
# не запускается ни разу.
#
# Вердикт выносится по ПОСЛЕДНИМ recent_minutes, а не по всей сессии: сессия
# может идти неделю, и суждение по ней целиком позволяло бы модели, запущенной
# пять дней назад, считаться «флот в работе», пока сегодня идёт монокультура.
# Накопительный вид остаётся в `dispatch-stats.py --report` как контекст.
#
# Два тормоза, срабатывать должны оба: remind_every (счётчик, гасит повтор
# внутри плотной пачки) и remind_cooldown_minutes (часы, гасят надоедание в
# медленной сессии). Напоминание, приходящее слишком часто, перестают читать.
#
# deliberate_model — период, когда всё осознанно идёт на одну модель с
# приоритетом. Названная здесь модель снимает наблюдение про флот;
# напоминания гейта о правилах продолжают работать. Это и есть штатный способ
# сказать «сейчас так и надо», вместо того чтобы глушить статистику целиком.
#
# [stats]
# enabled = true
# window = 8                     # сколько последних диспатчей рассматривать
# min_dispatches = 6             # молчать, пока данных мало
# monoculture_share = 0.75       # доля одной модели/класса, с которой напоминаем
# min_distinct_models = 3        # ожидаемое число РАЗНЫХ моделей в окне
# min_distinct_classes = 3       # то же для классов
# recent_minutes = 30            # окно вердикта
# remind_every = 8               # не чаще одного напоминания на N диспатчей
# remind_cooldown_minutes = 30   # и не чаще одного раза в N минут
# deliberate_model = "opus"      # осознанное сосредоточение, не забывчивость
#
# Один и тот же экземпляр модели под разными id — схлопывается ТОЛЬКО для
# счёта, иначе чередование двух написаний читается как разнообразие флота,
# которого нет. Гейт продолжает сверять id точно: алиас там впустил бы
# неизмеренного однофамильца.
#
# [stats.aliases]
# "claude-opus-5[1m]" = "opus"
